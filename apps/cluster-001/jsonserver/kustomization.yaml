apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-instance-01

resources:
  - namespace.yaml
  - ../../base/jsonserver

patches:
  - target:
      version: server.vambita.com/v1alpha1
      kind: JsonServer
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /metadata/name
        value: app-instance-01