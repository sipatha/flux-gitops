    app.kubernetes.io/name: json-server-operator
  name: json-server-operator-serving-cert
  namespace: json-server-operator-system
spec:
  dnsNames:
  - json-server-operator-webhook-service.json-server-operator-system.svc
  - json-server-operator-webhook-service.json-server-operator-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: json-server-operator-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: json-server-operator
  name: json-server-operator-selfsigned-issuer
  namespace: json-server-operator-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: json-server-operator-system/json-server-operator-serving-cert
  name: json-server-operator-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: json-server-operator-webhook-service
      namespace: json-server-operator-system
      path: /validate-server-vambita-com-v1alpha1-jsonserver
  failurePolicy: Fail
  name: vjsonserver-v1alpha1.kb.io
  rules:
  - apiGroups:
    - server.vambita.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - jsonservers
  sideEffects: None
